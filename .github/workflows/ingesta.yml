name: ingesta

# Ingesta programada (feature 006; RF-28, RNF-36). Corre `npm run ingesta -- --solo-metadatos`: actualiza metadatos de
# GitHub y logos de los repos que ya están en el dataset; conserva ideas y embeddings (en Actions no hay Ollama) y anota
# en data/ingesta-pendientes.json los repos nuevos para procesarlos en local. Si hay cambios, abre un PR; si la
# organización no deja que Actions cree PRs, sube el resultado como artifact (ver README, «Persistencia y pipeline»).
on:
  schedule:
    - cron: "17 6 * * 1" # lunes 06:17 UTC
  workflow_dispatch:

# Mínimo necesario: escribir la rama del resultado y abrir el PR. Nada más.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  ingesta:
    name: Metadatos y logos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      # El token del propio workflow: solo lee repos públicos; nunca un token personal ni un secreto del repo.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Acciones fijadas por SHA (cadena de suministro): actions/checkout v7.0.1, setup-node v7.1.0, upload-artifact v7.0.2.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Instalar (lockfile)
        run: npm ci --ignore-scripts
      - name: Ingesta (solo metadatos y logos)
        run: npm run ingesta -- --solo-metadatos
      - name: ¿Hay cambios?
        id: cambios
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- apps/web/data apps/web/public/logos)" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
            git status --short -- apps/web/data apps/web/public/logos
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios: no hay nada que publicar."
          fi
      - name: Resultado como artifact (siempre que haya cambios)
        if: steps.cambios.outputs.hay == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ingesta-resultado
          path: |
            apps/web/data
            apps/web/public/logos
          retention-days: 14
      - name: Abrir el PR
        id: pr
        if: steps.cambios.outputs.hay == 'true'
        working-directory: .
        continue-on-error: true
        run: |
          set -euo pipefail
          rama="ingesta/datos-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$rama"
          git add apps/web/data apps/web/public/logos
          git commit -m "chore(catalogo): ingesta programada, metadatos y logos (RF-28)"
          git push origin "$rama"
          gh pr create --base main --head "$rama" \
            --title "chore(catalogo): ingesta programada, metadatos y logos (RF-28)" \
            --body "Generado por .github/workflows/ingesta.yml con \`npm run ingesta -- --solo-metadatos\`. Conserva ideas y embeddings; los repos nuevos quedan en \`data/ingesta-pendientes.json\` para procesarlos en local. Revisar el diff antes de mergear."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Si no se pudo abrir el PR
        if: steps.cambios.outputs.hay == 'true' && steps.pr.outcome == 'failure'
        run: |
          echo "::warning::No se pudo abrir el PR (la organización puede no permitir que Actions cree PRs). El resultado quedó en el artifact «ingesta-resultado»: bajarlo y aplicarlo en local."
